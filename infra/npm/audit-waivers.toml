# npm-audit waivers — frontend SHIPPED dependencies (frontend/package-lock.json) ONLY.
#
# This is the ENFORCED waiver home: the gate in .github/workflows/ci.yml runs
# `python3 scripts/check_npm_audit.py`, which reads this file and suppresses only the
# advisories listed here (spec §6.7 keeps waivers scoped, never gate-wide — the same
# discipline as infra/osv/osv-scanner.toml and the per-image infra/trivy/*.trivyignore).
#
# The gate blocks on any unwaived HIGH/CRITICAL in a shipped dependency (devDependencies
# are out of scope — they never reach a user; spec §6.7, 2026-06-18). Prefer a FIX (bump
# to the fixed version via /add-dependency, soak-checked) over a waiver. Waive only an
# advisory that is assessed unreachable in THIS deployment AND has no soaked fix, and
# record the full rationale + drop-when in the human register infra/npm/WAIVERS.md.
# The two must mirror each other.
#
# `ignoreUntil` is MANDATORY here (unlike the OSV toml, where it is an optional backstop
# alongside a condition-based drop-when). npm advisories are fixed by a version bump we
# control, so every waiver has a real calendar horizon — and a mandatory expiry means an
# ignore re-reds on its own instead of rotting behind a green board. The script rejects a
# waiver without one, and reports a waiver that matches nothing as STALE so retired
# entries get deleted rather than accumulating.
#
# Template:
#
#   [[IgnoredVulns]]
#   id = "GHSA-xxxx-xxxx-xxxx"   # the GHSA id from the advisory URL
#   reason = "one line; full reachability + 'drop when' lives in WAIVERS.md"
#   ignoreUntil = 2026-12-31     # unquoted TOML date — a quoted one is rejected

# No active waivers. The sole entry, GHSA-qwww-vcr4-c8h2 (React Router RSC-mode CSRF),
# was DROPPED on 2026-08-13 by a FIX, not an expiry: react-router-dom 7.18.1 → 7.18.2.
#
# Worth knowing, because the waiver's own rationale said this was impossible: when it was
# written (2026-07-30) the advisory listed 8.3.0 as the only patched version, and since
# react-router-dom has no v8, no forward bump could clear it — verified empirically at the
# time against both 7.18.1 and 7.18.2. The advisory has since been AMENDED to record a 7.x
# backport, moving the vulnerable range to `>= 7.12.0, < 7.18.2`. So an advisory's "no fix
# available" is a point-in-time fact, not a permanent one — re-check it on review rather
# than trusting the recorded rationale. The script's STALE report is what surfaced it here.
#
# History + the full reachability rationale is retained in infra/npm/WAIVERS.md.
